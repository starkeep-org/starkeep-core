name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tier 1 is two jobs that run side by side: this one (format, lint,
  # typecheck) and tier-1-unit (unit tests). Branch protection requires both.
  # Integration tests run in their own jobs below.
  tier-1:
    name: Tier 1 (format, lint, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # `changeset status --since=origin/main` diffs against main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Turbo's local cache, so the postinstall build and `lint`/`typecheck`
      # replay instead of rerunning. `github.sha` makes every run save (an
      # exact-key hit never saves); `github.job` gives each job its own entry.
      # The `--` after the job id keeps one job's restore-key prefix from
      # matching another job's entries: `tier-1-` is a prefix of `tier-1-unit-`,
      # but `tier-1--` is not. The last step of the job prunes the cache before
      # the post step saves it; see there.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}--${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}--${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-${{ github.job }}--
      # The root `postinstall` runs `turbo run build`, which restores unchanged
      # packages from the cache above and builds the rest.
      - run: pnpm install --frozen-lockfile
      # A pull request that changes what a published package ships must say what
      # it releases. On main, list what awaits the next manual release.
      - name: Changesets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm changeset status --since=origin/main
          else
            pnpm changeset status --verbose
          fi
      - run: pnpm format:check
      - run: pnpm check:icons
      - run: pnpm turbo run lint typecheck
      # Turbo never evicts its local cache, and the restore-keys above always
      # bring back the previous run's entry, so without this each job's entry
      # would grow with every push: hundreds of MB within months, all against
      # the repository's 10 GB cache quota, with the saves and restores slowing
      # to match. Dropping entries nothing has written in a week keeps it to
      # what the last week's runs built. tar keeps mtimes across restore, and a
      # hit replays an entry without rewriting it, so an output unchanged for a
      # week is rebuilt once and saved fresh. Runs before actions/cache's post
      # step saves the directory.
      - name: Prune Turbo cache entries older than 7 days
        run: test ! -d .turbo/cache || find .turbo/cache -type f -mtime +7 -delete

  # Tier 1's unit tests, every package's `test` task. Split from tier-1 so they
  # run alongside lint and typecheck instead of after them. Branch protection
  # requires both Tier 1 jobs.
  tier-1-unit:
    name: Tier 1 (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Turbo's cache, per job; see tier-1.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}--${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}--${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-${{ github.job }}--
      - run: pnpm install --frozen-lockfile
      # Every package's vitest pool at once oversubscribes the runner's four
      # cores until a worker misses its RPC deadline ("Timeout calling
      # onTaskUpdate") with every test passing. Two suites at a time does not.
      - run: pnpm turbo run test --concurrency=2
      # Prune the Turbo cache before the post step saves it; see tier-1.
      - name: Prune Turbo cache entries older than 7 days
        run: test ! -d .turbo/cache || find .turbo/cache -type f -mtime +7 -delete

  # Integration: suites under each package's `__tests__/integration/`, which boot
  # a process, a socket or a database engine (the local data server as a child
  # process, the fake cloud on loopback, PGlite). Split in two jobs that run
  # side by side. Advisory; branch protection requires the two Tier 1 jobs only.
  #
  # This job: the PGlite-backed suites, the slowest ones. The same three
  # packages are excluded by name in integration-processes below, so every
  # `test:integration` task runs in exactly one of the two jobs.
  integration-pglite:
    name: Integration (PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Turbo's cache, per job; see tier-1.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}--${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}--${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-${{ github.job }}--
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:integration --concurrency=2 --filter=@starkeep/builtin-cloud-data-server --filter=@starkeep/storage-aurora-dsql --filter=@starkeep/admin-installer
      # Prune the Turbo cache before the post step saves it; see tier-1.
      - name: Prune Turbo cache entries older than 7 days
        run: test ! -d .turbo/cache || find .turbo/cache -type f -mtime +7 -delete

  # Every other package's integration suite: the local data server as a child
  # process, the fake cloud on loopback. The filters negate integration-pglite's
  # three packages, so a package that gains `test:integration` later runs here.
  integration-processes:
    name: Integration (processes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Turbo's cache, per job; see tier-1.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}--${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}--${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-${{ github.job }}--
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:integration --concurrency=2 --filter='!@starkeep/builtin-cloud-data-server' --filter='!@starkeep/storage-aurora-dsql' --filter='!@starkeep/admin-installer'
      # Prune the Turbo cache before the post step saves it; see tier-1.
      - name: Prune Turbo cache entries older than 7 days
        run: test ! -d .turbo/cache || find .turbo/cache -type f -mtime +7 -delete

  # Tier 2: the local platform end to end, through Playwright. Advisory until
  # it has run two weeks without a flake; branch protection does not require it.
  tier-2:
    name: Tier 2 (local end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Turbo's cache, per job; see tier-1.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}--${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}--${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-${{ github.job }}--
      - run: pnpm install --frozen-lockfile
      # Chromium from the cache, keyed on the installed Playwright version; on a
      # hit only the system libraries (apt) still install.
      - id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: e2e
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @starkeep/e2e exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @starkeep/e2e exec playwright install-deps chromium
      - run: pnpm test:e2e
      # Prune the Turbo cache before the post step saves it; see tier-1.
      - name: Prune Turbo cache entries older than 7 days
        run: test ! -d .turbo/cache || find .turbo/cache -type f -mtime +7 -delete
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier-2-test-results
          path: e2e/test-results/
          retention-days: 14

  # The example app against this pull request's platform. The example is its
  # own pnpm workspace, so it installs `@starkeep/app-client` from npm, as a
  # third-party app does, while the harness boots local-data-server, admin-web
  # and Drive from this checkout's source. A platform change that breaks an
  # app-facing operation fails here.
  example-tier-2:
    name: Example app (tier 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            example-app/pnpm-lock.yaml
      # Turbo's cache, per job; see tier-1.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}--${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}--${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-${{ github.job }}--
      # Core's install: the platform the harness boots.
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: example-app
      # Playwright strips the suite's types without checking them, and the
      # root `typecheck` skips the suite, because it needs core's harness.
      - run: pnpm typecheck:e2e
        working-directory: example-app
        env:
          STARKEEP_CORE_DIR: ${{ github.workspace }}
      # Chromium from the cache, keyed on the installed Playwright version; on a
      # hit only the system libraries (apt) still install.
      - id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: example-app/e2e
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @example-app/e2e exec playwright install --with-deps chromium
        working-directory: example-app
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @example-app/e2e exec playwright install-deps chromium
        working-directory: example-app
      - run: pnpm test:e2e
        working-directory: example-app
        env:
          STARKEEP_CORE_DIR: ${{ github.workspace }}
      # Prune the Turbo cache before the post step saves it; see tier-1.
      - name: Prune Turbo cache entries older than 7 days
        run: test ! -d .turbo/cache || find .turbo/cache -type f -mtime +7 -delete
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: example-tier-2-test-results
          path: example-app/e2e/test-results/
          retention-days: 14

  # The example app copied out of this repository, the way an author copies
  # it. Catches anything the example silently borrows from core: a base
  # tsconfig, a tool core's root installs, a path that climbs out of the folder.
  example-copied-out:
    name: Example app (copied out)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: example-app/pnpm-lock.yaml
      - name: Copy the example out of the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/example-app"
          git archive HEAD:example-app | tar -x -C "$RUNNER_TEMP/example-app"
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ runner.temp }}/example-app
      - run: pnpm typecheck
        working-directory: ${{ runner.temp }}/example-app
      - run: pnpm test
        working-directory: ${{ runner.temp }}/example-app
      - run: pnpm build
        working-directory: ${{ runner.temp }}/example-app
      - run: pnpm bundle
        working-directory: ${{ runner.temp }}/example-app
        env:
          STARKEEP_APP_BASE_PATH: /apps/example-app
          STARKEEP_BUNDLE_OUT: ${{ runner.temp }}/example-dist.zip
