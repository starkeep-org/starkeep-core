name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tier 1: format, lint, typecheck and unit tests. The required check on main.
  # Integration tests run in their own job below.
  tier-1:
    name: Tier 1 (format, lint, typecheck, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # `changeset status --since=origin/main` diffs against main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The root `postinstall` builds every package through turbo.
      - run: pnpm install --frozen-lockfile
      # A pull request that changes what a published package ships must say what
      # it releases. On main, list what awaits the next manual release.
      - name: Changesets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm changeset status --since=origin/main
          else
            pnpm changeset status --verbose
          fi
      - run: pnpm format:check
      - run: pnpm check:icons
      - run: pnpm turbo run lint typecheck
      # Every package's vitest pool at once oversubscribes the runner's four
      # cores until a worker misses its RPC deadline ("Timeout calling
      # onTaskUpdate") with every test passing. Two suites at a time does not.
      - run: pnpm turbo run test --concurrency=2

  # Integration: suites under each package's `__tests__/integration/`, which boot
  # a process, a socket or a database engine (the local data server as a child
  # process, the fake cloud on loopback, PGlite). Advisory; branch protection
  # requires tier 1 only.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:integration --concurrency=2

  # Tier 2: the local platform end to end, through Playwright. Advisory until
  # it has run two weeks without a flake; branch protection does not require it.
  tier-2:
    name: Tier 2 (local end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @starkeep/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier-2-test-results
          path: e2e/test-results/
          retention-days: 14

  # The example app against this pull request's platform. The example is its
  # own pnpm workspace, so it installs `@starkeep/app-client` from npm, as a
  # third-party app does, while the harness boots local-data-server, admin-web
  # and Drive from this checkout's source. A platform change that breaks an
  # app-facing operation fails here.
  example-tier-2:
    name: Example app (tier 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            example-app/pnpm-lock.yaml
      # Core's install: the platform the harness boots.
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: example-app
      # Playwright strips the suite's types without checking them, and the
      # root `typecheck` skips the suite, because it needs core's harness.
      - run: pnpm typecheck:e2e
        working-directory: example-app
        env:
          STARKEEP_CORE_DIR: ${{ github.workspace }}
      - run: pnpm --filter @example-app/e2e exec playwright install --with-deps chromium
        working-directory: example-app
      - run: pnpm test:e2e
        working-directory: example-app
        env:
          STARKEEP_CORE_DIR: ${{ github.workspace }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: example-tier-2-test-results
          path: example-app/e2e/test-results/
          retention-days: 14

  # The example app copied out of this repository, the way an author copies
  # it. Catches anything the example silently borrows from core: a base
  # tsconfig, a tool core's root installs, a path that climbs out of the folder.
  example-copied-out:
    name: Example app (copied out)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: example-app/pnpm-lock.yaml
      - name: Copy the example out of the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/example-app"
          git archive HEAD:example-app | tar -x -C "$RUNNER_TEMP/example-app"
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ runner.temp }}/example-app
      - run: pnpm typecheck
        working-directory: ${{ runner.temp }}/example-app
      - run: pnpm test
        working-directory: ${{ runner.temp }}/example-app
      - run: pnpm build
        working-directory: ${{ runner.temp }}/example-app
      - run: pnpm bundle
        working-directory: ${{ runner.temp }}/example-app
        env:
          STARKEEP_APP_BASE_PATH: /apps/example-app
          STARKEEP_BUNDLE_OUT: ${{ runner.temp }}/example-dist.zip

  # The `starkeep` Claude Code plugin and this repository's marketplace: both
  # manifests pass the strict validator, the synced doc copies under
  # `plugins/starkeep/ref/` match the originals, every skill link resolves,
  # the plugin loads with one skill per `skills/*/` directory, and it installs
  # from the marketplace. None of it needs the workspace, so there is no pnpm
  # and no `pnpm install`; the Claude Code CLI runs without a login or API key.
  # Advisory; branch protection requires tier 1 only.
  plugin:
    name: Plugin (validate, links, load)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@2.1.322
      - run: claude plugin validate plugins/starkeep --strict
      - run: claude plugin validate . --strict
      - name: Synced doc copies match the originals
        run: |
          node scripts/sync-plugin-ref.mjs
          # Intent-to-add, so a copy that was never committed shows in the diff.
          git add --intent-to-add plugins/starkeep/ref
          git diff --exit-code plugins/starkeep/ref
      - run: node scripts/check-skill-links.mjs
      - name: The plugin loads every skill directory
        run: |
          expected=0
          if [ -d plugins/starkeep/skills ]; then
            expected=$(find plugins/starkeep/skills -mindepth 1 -maxdepth 1 -type d | wc -l)
          fi
          details=$(claude --plugin-dir plugins/starkeep plugin details starkeep)
          echo "$details"
          actual=$(echo "$details" | sed -n 's/.*Skills (\([0-9]*\)).*/\1/p' | head -n 1)
          if [ "$actual" != "$expected" ]; then
            echo "expected Skills ($expected), got Skills (${actual:-none})" >&2
            exit 1
          fi
      - name: The plugin installs from the marketplace
        run: |
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install starkeep@starkeep-core
          claude plugin list | tee plugins.txt
          grep -F "starkeep@starkeep-core" plugins.txt
